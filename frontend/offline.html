<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1f7">
  <title>Sin conexión · NoteFlow</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/paginas.css">
</head>
<body class="pagina-offline">
  <main class="sin-conexion">
    <div class="tarjeta sin-conexion-tarjeta">
      <img class="sin-conexion-logo" src="/img/logo.svg" alt="">
      <h1>Estás sin conexión</h1>
      <p>Tus notas y tareas están guardadas de forma segura en la nube. Cuando vuelva el internet, NoteFlow se abre solo.</p>
      <button class="boton boton-acento" type="button" id="reintentar">Reintentar</button>
      <p class="pequeno texto-secundario">Consejo: activa los datos o conéctate a una red Wi-Fi.</p>
    </div>
  </main>
  <script src="/js/offline.js"></script>
</body>
</html>
