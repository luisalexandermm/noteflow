<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="NoteFlow — Tus ideas, mejor organizadas. Notas, materias, tareas y calendario para estudiantes.">
  <meta name="theme-color" content="#eef1f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NoteFlow">
  <title>Asistente IA · NoteFlow</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="../img/iconos/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../img/iconos/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/paginas.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/aviso-archivo.js"></script>
  <script src="../vendor/gsap/gsap.min.js" defer></script>
</head>

<body data-pagina="asistente" class="pagina-asistente">
  <div class="app">
    <!-- Menú lateral, barra superior y navegación de celular: los dibuja js/navegacion.js -->
    <aside class="barra-lateral" id="barra-lateral" aria-label="Menú principal"></aside>

    <div class="principal">
      <header class="barra-superior" id="barra-superior"></header>
      <header class="cabecera-movil" id="cabecera-movil"></header>

      <main class="contenido" id="contenido">
        <section class="tarjeta chat" data-animar>
          <header class="chat-cabecera">
            <span class="avatar-ia"><span data-icono="ia"></span></span>
            <h1>Asistente IA</h1>
            <span class="pastilla">Beta</span>
            <span class="espaciador"></span>
            <button class="boton boton-fantasma" id="nueva-conversacion" type="button"><span data-icono="reiniciar"></span>Nueva</button>
          </header>

          <div class="chat-mensajes" id="chat-mensajes" aria-live="polite"></div>

          <form class="chat-entrada" id="formulario-chat">
            <div class="caja-mensaje">
              <textarea id="mensaje-chat" rows="1" maxlength="2000" placeholder="Escribe tu mensaje…" aria-label="Mensaje para el asistente"></textarea>
              <button class="boton-enviar" type="submit" aria-label="Enviar mensaje"><span data-icono="enviar"></span></button>
            </div>
            <p class="ayuda">Modo demostración: responde con tus datos de NoteFlow. La IA real se conecta en la Fase 7.</p>
          </form>
        </section>
      </main>
    </div>
  </div>

  <nav class="navegacion-inferior" id="navegacion-inferior" aria-label="Navegación principal"></nav>


  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/asistente.js"></script>
</body>
</html>
