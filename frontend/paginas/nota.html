<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="NoteFlow — Tus ideas, mejor organizadas. Notas, materias, tareas y calendario para estudiantes.">
  <meta name="theme-color" content="#eef1f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NoteFlow">
  <title>Nota · NoteFlow</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="../img/iconos/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../img/iconos/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/paginas.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/aviso-archivo.js"></script>
  <script src="../vendor/gsap/gsap.min.js" defer></script>
</head>

<body data-pagina="notas" class="pagina-nota">
  <div class="app">
    <!-- Menú lateral, barra superior y navegación de celular: los dibuja js/navegacion.js -->
    <aside class="barra-lateral" id="barra-lateral" aria-label="Menú principal"></aside>

    <div class="principal">
      <header class="barra-superior" id="barra-superior"></header>
      <header class="cabecera-movil" id="cabecera-movil"></header>

      <main class="contenido" id="contenido">
        <article class="tarjeta editor-nota" data-animar>
          <!-- Título, materia, etiquetas y acciones -->
          <div class="editor-cabecera">
            <a class="boton-icono" href="notas.html" aria-label="Volver a mis notas"><span data-icono="atras"></span></a>
            <div class="datos">
              <input class="titulo-nota" id="titulo-nota" type="text" maxlength="150" placeholder="Título de la nota" aria-label="Título de la nota">
              <div class="editor-meta">
                <select class="selector" id="materia-nota" aria-label="Materia"></select>
                <input class="entrada entrada-etiquetas" id="etiquetas-nota" type="text" maxlength="120" placeholder="Etiquetas: bd, mer" aria-label="Etiquetas separadas por coma">
                <span id="fecha-nota"></span>
                <span class="estado-guardado" id="estado-guardado" aria-live="polite"></span>
              </div>
            </div>
            <div class="editor-acciones">
              <button class="boton-icono boton-favorita" id="boton-favorita" type="button" aria-label="Marcar como favorita" aria-pressed="false"><span data-icono="estrella"></span></button>
              <button class="boton-icono boton-peligro" id="boton-eliminar" type="button" aria-label="Eliminar nota"><span data-icono="basura"></span></button>
            </div>
          </div>

          <!-- Barra de formato -->
          <div class="editor-herramientas" id="herramientas" role="toolbar" aria-label="Formato del texto">
            <button class="boton-icono" type="button" data-formato="h1" title="Título"><span class="texto-boton">H1</span></button>
            <button class="boton-icono" type="button" data-formato="h2" title="Subtítulo"><span class="texto-boton">H2</span></button>
            <button class="boton-icono" type="button" data-formato="p" title="Texto normal"><span class="texto-boton">¶</span></button>
            <span class="separador"></span>
            <button class="boton-icono" type="button" data-formato="bold" title="Negrita (Ctrl+B)"><span data-icono="negrita"></span></button>
            <button class="boton-icono" type="button" data-formato="italic" title="Cursiva (Ctrl+I)"><span data-icono="cursiva"></span></button>
            <span class="separador"></span>
            <button class="boton-icono" type="button" data-formato="ul" title="Lista"><span data-icono="lista"></span></button>
            <button class="boton-icono" type="button" data-formato="ol" title="Lista numerada"><span data-icono="lista_numerada"></span></button>
            <button class="boton-icono" type="button" data-formato="pre" title="Bloque de código"><span data-icono="codigo"></span></button>
            <span class="separador"></span>
            <button class="boton-icono" type="button" data-formato="enlace" title="Enlace"><span data-icono="enlace"></span></button>
            <button class="boton-icono" type="button" data-formato="imagen" title="Imagen (máx. 1 MB)"><span data-icono="imagen"></span></button>
            <input id="archivo-imagen" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          </div>

          <!-- El texto de la nota -->
          <div class="contenido-nota" id="contenido-nota" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Contenido de la nota" data-placeholder="Empieza a escribir…"></div>

          <!-- Preguntar a la IA sobre esta nota -->
          <div class="zona-ia">
            <div class="respuesta-ia" id="respuesta-ia" hidden></div>
            <form class="barra-ia" id="formulario-ia">
              <span class="avatar-ia"><span data-icono="ia"></span></span>
              <input id="pregunta-ia" type="text" maxlength="2000" placeholder="Pregúntale a la IA sobre esta nota…" aria-label="Pregunta para la IA">
              <button class="boton-enviar" type="submit" aria-label="Enviar pregunta"><span data-icono="enviar"></span></button>
            </form>
          </div>
        </article>
      </main>
    </div>
  </div>

  <nav class="navegacion-inferior" id="navegacion-inferior" aria-label="Navegación principal"></nav>


  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/nota.js"></script>
</body>
</html>
