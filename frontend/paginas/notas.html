<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="NoteFlow — Tus ideas, mejor organizadas. Notas, materias, tareas y calendario para estudiantes.">
  <meta name="theme-color" content="#eef1f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NoteFlow">
  <title>Mis notas · NoteFlow</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="../img/iconos/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../img/iconos/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/paginas.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/aviso-archivo.js"></script>
  <script src="../vendor/gsap/gsap.min.js" defer></script>
</head>

<body data-pagina="notas" class="pagina-notas">
  <div class="app">
    <!-- Menú lateral, barra superior y navegación de celular: los dibuja js/navegacion.js -->
    <aside class="barra-lateral" id="barra-lateral" aria-label="Menú principal"></aside>

    <div class="principal">
      <header class="barra-superior" id="barra-superior"></header>
      <header class="cabecera-movil" id="cabecera-movil"></header>

      <main class="contenido" id="contenido">
        <header class="encabezado-pagina" data-animar>
          <div>
            <h1 class="titulo-pagina">Mis notas</h1>
            <p>Tus apuntes organizados por materia.</p>
          </div>
          <div class="acciones">
            <a class="boton boton-primario" href="nota.html?nueva=1" aria-label="Nueva nota"><span data-icono="mas"></span><span class="texto-boton">Nueva nota</span></a>
          </div>
        </header>

        <div class="barra-filtros" data-animar>
          <label class="buscador">
            <span data-icono="buscar"></span>
            <input class="entrada" id="buscar-notas" type="search" placeholder="Buscar en mis notas…" aria-label="Buscar en mis notas">
          </label>
          <select class="selector" id="orden-notas" aria-label="Ordenar notas">
            <option value="recientes">Más recientes</option>
            <option value="titulo">Por título (A–Z)</option>
          </select>
        </div>

        <div class="grupo-chips" id="filtros-materia" role="group" aria-label="Filtrar por materia" data-animar></div>

        <p class="contador-resultados" id="contador-notas" aria-live="polite"></p>
        <div class="rejilla-notas" id="contenedor-notas"></div>
      </main>
    </div>
  </div>

  <nav class="navegacion-inferior" id="navegacion-inferior" aria-label="Navegación principal"></nav>


  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/notas.js"></script>
</body>
</html>
